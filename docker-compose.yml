services:
  ntfy:
    image: binwiederhier/ntfy:v2.28
    container_name: server-alarm-ntfy
    restart: always
    env_file:
      - ./ntfy/.env
    ports:
      - "127.0.0.1:8888:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
    command:
      - serve
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    init: true
    networks:
      - main_network

  api:
    build:
      context: ./api
      dockerfile: ./build/Dockerfile
    container_name: server-alarm-api
    restart: always
    env_file:
     - ./api/.env
    volumes:
      - ./api/config.yml:/app/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:5555/health -O - | grep -Eo 'ok' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    network_mode: host
    depends_on:
      - ntfy

volumes:
  ntfy_cache:
  ntfy_data:

networks:
  main_network:
    driver: bridge
